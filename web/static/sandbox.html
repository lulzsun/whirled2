<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>swf sandbox</title>
		<!--
			The Flash sandbox. See docs/specs/swf-avatar-rendering.md section 16.

			This document exists to hold user-uploaded Flash and nothing else.
			It is served from its own origin so that a hostile avatar reaching
			`window` reaches only this: no session, no storage, no DOM of ours.

			Everything it loads is relative, so it all comes from the sandbox
			origin -- ruffle.js, the wasm beside it, whirled-host.swf, and the
			avatar itself. Do not add an absolute URL here. Fetching any part of
			this from the app origin puts the shim and the avatar in different
			Flash security domains, and the SDK handshake stops working.
		-->
		<style>
			html,
			body {
				margin: 0;
				width: 0;
				height: 0;
				overflow: hidden;
				background: transparent;
			}
		</style>
		<script src="./ruffle.js"></script>
	</head>
	<body>
		<script type="module" src="./sandbox-boot.js"></script>
	</body>
</html>
