syntax = "proto3";

package whirled2;

option go_package = "whirled2/utils/proto";

import "common.proto";

message ObjectJoin {
    Object object = 1;
}

message ObjectLeave {
    string id = 1;
    bool isPlayer = 2;
}

message ObjectTransform {
    string id = 1;
    bool isPlayer = 2;
    Position position = 3;
    Rotation rotation = 4;
    Scale scale = 5;
}

// A part's description changing -- material, tint, flags. Transform changes
// go through ObjectTransform; this is everything else about a part, and it
// exists because until now a part could be created and moved but never
// edited.
message ObjectPartUpdate {
    string id = 1;
    Part part = 2;
}

// Sent only to the peer whose request was refused. Without it a rejected
// placement is indistinguishable from a dead click, which is the failure
// mode the removal button already had to be rescued from.
message ObjectDenied {
    // stuff id for furniture, nonce for a part
    string id = 1;
    DenyReason reason = 2;
}

enum DenyReason {
    Unknown = 0;
    NotOwner = 1;
    CapacityFull = 2;
    InvalidPart = 3;
    Duplicate = 4;
}

// Sent to the room owner on join and after every part add or remove,
// so the build UI can show what is left without asking.
message RoomCapacity {
    uint32 used = 1;
    uint32 capacity = 2;
}